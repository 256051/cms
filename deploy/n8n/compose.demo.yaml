name: cms-n8n-demo
services:
  api:
    build:
      context: ../..
      dockerfile: deploy/Dockerfile.api
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      Database__Type: Sqlite
      Database__ConnectionString: Data Source=/data/cms.db
      Consul__Enabled: "false"
      Maintenance__BackupIntervalHours: "0"
    volumes: [cms-data:/data]
  web:
    build:
      context: ../..
      dockerfile: deploy/Dockerfile.web
    environment:
      API_INTERNAL_URL: http://api:8080
      SITE_URL: http://127.0.0.1:${CMS_DEMO_PORT:-13000}
    ports: ["127.0.0.1:${CMS_DEMO_PORT:-13000}:3000"]
    depends_on: [api]
  n8n:
    image: docker.n8n.io/n8nio/n8n:2.40.5
    ports: ["127.0.0.1:${N8N_DEMO_PORT:-15678}:5678"]
    environment:
      N8N_SECURE_COOKIE: "false"
      N8N_DIAGNOSTICS_ENABLED: "false"
      N8N_VERSION_NOTIFICATIONS_ENABLED: "false"
      N8N_PERSONALIZATION_ENABLED: "false"
      N8N_TEMPLATES_ENABLED: "false"
      GENERIC_TIMEZONE: Asia/Shanghai
      TZ: Asia/Shanghai
    volumes: [n8n-data:/home/node/.n8n]
volumes:
  cms-data:
  n8n-data:
