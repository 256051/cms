# Install in the host Nginx http context, e.g. conf.d/itmao.conf.
# Reuse your real certificate paths. Do not mount this file into the CMS gateway.
server {
    listen 80;
    server_name itmao.club;
    return 308 https://itmao.club$request_uri;
}

server {
    listen 443 ssl;
    server_name itmao.club;
    ssl_certificate /etc/nginx/ssl/itmao.club/fullchain.pem;
    ssl_certificate_key /etc/nginx/ssl/itmao.club/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    client_max_body_size 53m;

    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Connection "";
    proxy_cache off;
    proxy_buffering off;

    location ^~ /api/ {
        proxy_pass http://127.0.0.1:5080;
    }
    location ^~ /media/ {
        proxy_pass http://127.0.0.1:5080;
    }
    location ^~ /health/ {
        proxy_pass http://127.0.0.1:5080;
    }
    location / {
        proxy_pass http://127.0.0.1:3000;
    }
}
